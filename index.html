    <title>Sahan Shrestha - Full Stack Developer</title>

    <script>
      // Applied before first paint so the correct palette is on screen immediately.
      // Without this the CSS :root fallback flashes before React mounts.
      (function () {
        try {
          var stored = localStorage.getItem('portfolio-theme') || 'folio'
          document.documentElement.dataset.theme = stored
        } catch (e) {
          document.documentElement.dataset.theme = 'folio'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
